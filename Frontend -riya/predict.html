<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kisan Setu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html">🌉 <span data-lang="title"></span></a>
    <div id="langbox" class="notranslate"></div>
  </header>
  <nav>
    <a href="index.html" data-lang="n_home"></a>
    <a href="predict.html" data-lang="n_predict"></a>
    <a href="chat.html" data-lang="n_chat"></a>
  </nav>
  <div id="toast" role="status"></div>
  <main>
    <h1 data-lang="p_title"></h1>
    <p data-lang="p_sub"></p>

    <label for="crop" data-lang="crop"></label>
    <select id="crop" onchange="predictNow()">
      <option value="wheat" data-lang="c_wheat"></option>
      <option value="rice" data-lang="c_rice"></option>
      <option value="tomato" data-lang="c_tomato"></option>
      <option value="onion" data-lang="c_onion"></option>
      <option value="potato" data-lang="c_potato"></option>
    </select>

    <label for="quality" data-lang="p_quality"></label>
    <select id="quality" onchange="predictNow()">
      <option value="A" data-lang="q_a"></option>
      <option value="B" data-lang="q_b" selected></option>
      <option value="C" data-lang="q_c"></option>
    </select>

    <label for="month" data-lang="p_month"></label>
    <select id="month" onchange="predictNow()"></select>

    <label for="qty" data-lang="qty"></label>
    <input id="qty" type="tel" inputmode="numeric" value="10" oninput="predictNow()">

    <div id="result" class="result"></div>
    <a class="bada" href="farmer.html" data-lang="p_list"></a>
    <p class="hint" data-lang="p_note"></p>
  </main>
  <script src="lang.js"></script>
  <script src="data.js"></script>
  <script src="predict.js"></script>
</body>
</html>
